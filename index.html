<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Browser - 官方法律条款与政策</title>
    <style>
        :root {
            --primary: #0A84FF;
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --subtext: #8b949e;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --primary: #0066CC;
                --bg: #f6f8fa;
                --card: #ffffff;
                --border: #d0d7de;
                --text: #1f2328;
                --subtext: #656d76;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 540px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0A84FF, #0040DD);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: #fff;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(10, 132, 255, 0.3);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            color: var(--subtext);
            font-size: 15px;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 132, 255, 0.08);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 12px;
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .link-card:hover {
            border-color: var(--primary);
            background: rgba(10, 132, 255, 0.15);
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: var(--subtext);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✈️</div>
        <h1>Online Browser</h1>
        <p>Online Browser · 官方条款与法律支持</p>

        <div class="links">
            <a href="terms.html" class="link-card">
                <span>📄 使用条款 (Terms of Service / EULA)</span>
                <span>→</span>
            </a>
            <a href="privacy.html" class="link-card">
                <span>🔒 隐私政策 (Privacy Policy)</span>
                <span>→</span>
            </a>
        </div>

        <div class="footer">
            © 2026 Online Browser · 联系邮箱: 475191923@qq.com
        </div>
    </div>
</body>
</html>
